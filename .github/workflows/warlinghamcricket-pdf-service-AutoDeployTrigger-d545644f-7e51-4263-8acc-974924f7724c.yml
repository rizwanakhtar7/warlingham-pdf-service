name: Trigger auto deployment for warlinghamcricket-pdf-service

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/warlinghamcricket-pdf-service-AutoDeployTrigger-d545644f-7e51-4263-8acc-974924f7724c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WARLINGHAMCRICKETPDFSERVICE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WARLINGHAMCRICKETPDFSERVICE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WARLINGHAMCRICKETPDFSERVICE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.WARLINGHAMCRICKETPDFSERVICE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WARLINGHAMCRICKETPDFSERVICE_REGISTRY_PASSWORD }}
          containerAppName: warlinghamcricket-pdf-service
          resourceGroup: warlingham-club
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


